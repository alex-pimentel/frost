<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Frost Forms</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 260px; margin: 0; padding: 14px;
        background: #f7fbff; color: #123a5c;
      }
      h1 { font-size: 13px; margin: 0 0 6px; }
      p { font-size: 12px; color: #55768f; margin: 0 0 10px; line-height: 1.5; }
      button {
        font: inherit; font-size: 12px; width: 100%; padding: 7px;
        border-radius: 8px; border: 1px solid #cfe4f7; background: #fff;
        color: #123a5c; cursor: pointer;
      }
      .status { font-size: 12px; margin-top: 10px; }
      .status.ok { color: #2f7d4f; }
      .status.error { color: #b4453a; }
    </style>
  </head>
  <body>
    <h1>Frost Forms</h1>
    <p>Abra o formulário e use o painel no canto da página para buscar e preencher.</p>
    <button id="options">Configurar conexão</button>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
